<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{
            font: normal 20pt Arial;
            background-color: rgb(42, 139, 42);
            color: white;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="saiu()">
        Interaja...
    </div>

    <script>
        let area = window.document.getElementById('area')
        function clicar(){
            area.innerHTML = 'Clicou'
            area.style.background = 'yellow'
            area.style.color = 'black'
            area.style.border = '5px'
        }

        function entrar(){
            area.innerHTML = 'Entrou'
            area.style.background = 'pink'
            area.style.color = 'black'
        }

        function saiu(){
            area.innerHTML = 'Saiu'
            area.style.background = 'green'
        }
    </script>
    
</body>
</html>
