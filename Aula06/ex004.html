<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
           background-color: bisque;
           font-family: Arial, Helvetica, sans-serif;
        }

        #qtd, #maius, #minus{
            background-color: yellow;
            color: black;
        }
    </style>
</head>
<body>
    <p id="qtd">Nome quantas letras</p>
    <p id="maius">Nome maiusculas</p>
    <p id="minus">Nome minusculas</p>
    
    <script>
        let nome = prompt('Qual é seu nome:')
        let qtd = document.getElementById('qtd')
        let maius = document.getElementById('maius')
        let minus = document.getElementById('minus')

        qtd.innerHTML = (`Seu nome tem ${nome} tem ${nome.length} letras`)
        maius.innerHTML = (`Seu nome em letras Maiúsculas ${nome.toUpperCase()}`)
        minus.innerHTML = (`Seu nome em letras Minúsculas ${nome.toLowerCase()}`)
    </script>
</body>
</html>
