<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let agora = new Date()
        let hora = agora.getHours

        if(hora <= 12){
            console.log('Bom dia!')
        }else if(hora <= 17.59){
            console.log('Bouaa tarde!')
        }else if(hora <= 23 && hora > 0){
            console.log('Boua noite!')
        }
    </script>
    
</body>
</html>
